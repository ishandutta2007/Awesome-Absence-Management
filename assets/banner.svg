<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#accentGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .card-stat {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 22px;
      fill: #f8fafc;
    }
    .card-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #64748b;
    }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.15">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Animated Ambient Glowing Orbs in Background -->
  <circle cx="180" cy="110" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="180;230;180" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="110;150;110" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="8s" repeatCount="indefinite" />
  </circle>

  <circle cx="1020" cy="280" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="1020;970;1020" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="280;240;280" dur="15s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.25;0.12" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Interactive Floating Metric Cards in Lower Canvas -->
  <g transform="translate(680, 50)">
    <!-- Card 1: Enterprise & Market -->
    <rect x="0" y="0" width="220" height="90" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="y" values="0; -6; 0" dur="6s" repeatCount="indefinite" />
    </rect>
    <text x="18" y="28" class="card-title">🌐 Global Market</text>
    <text x="18" y="58" class="card-stat">$18.3B+</text>
    <text x="18" y="78" class="card-sub">Expanding at 7.3% CAGR</text>

    <!-- Card 2: PTO & Accruals -->
    <rect x="240" y="30" width="230" height="90" rx="12" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="y" values="30; 24; 30" dur="7s" repeatCount="indefinite" />
    </rect>
    <text x="258" y="58" class="card-title" fill="#818cf8">⚡ Accrual Automation</text>
    <text x="258" y="88" class="card-stat">FMLA &amp; Statutory</text>
    <text x="258" y="108" class="card-sub">200+ Regional Compliance Rules</text>

    <!-- Card 3: Open-Source Focus -->
    <rect x="120" y="160" width="310" height="85" rx="12" fill="url(#cardGrad1)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="y" values="160; 168; 160" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="140" y="188" class="card-title" fill="#c084fc">⭐ Open-Source &amp; SaaS</text>
    <text x="140" y="218" class="card-stat">Self-Hosted &amp; Cloud</text>
    <text x="140" y="234" class="card-sub">Frappe HR, TimeOff, Gauzy &amp; Enterprise Suites</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 115)">
    <!-- Primary Heading -->
    <text x="0" y="0" class="title">Awesome Absence Management 🗓️</text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="42" class="subtitle">The definitive directory of Leave Tracking, PTO Accrual &amp; Workforce Availability tools</text>
    <text x="0" y="70" class="subtitle" font-size="16px">Curated SaaS platforms, Enterprise HCMs, and Open-Source self-hosted repositories</text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 120)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="22" class="pill-text">Leave Tracking</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <circle cx="173" cy="17" r="5" fill="#818cf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="187" y="22" class="pill-text">PTO Accruals</text>

      <!-- Pill 3 -->
      <rect x="300" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <circle cx="318" cy="17" r="5" fill="#a855f7">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <text x="332" y="22" class="pill-text">Compliance Engines</text>

      <!-- Pill 4 -->
      <rect x="480" y="0" width="155" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <circle cx="498" cy="17" r="5" fill="#34d399">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="512" y="22" class="pill-text">Self-Hosted FOSS</text>
    </g>
  </g>
</svg>
